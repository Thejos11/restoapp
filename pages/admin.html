<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ComputeShop - Admin</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

<div class="contenedor-principal">
    <div class="nav-bar">
        <a href="../index.html">🏠 Inicio</a>
        <a href="./pedido.html">📋 Pedidos</a>
        <button id="logoutBtn" onclick="cerrarSesion()" style="background-color: #e74c3c;">Cerrar sesión</button>
    </div>

    <h2>⚙️ Administración de Inventario</h2>
    
    <!-- TODO: Implementar validación más robusta -->
    <!-- TODO: Agregar confirmación de admin antes de crear productos -->
    <!-- TODO: Permitir editar/eliminar productos existentes -->
    
    <div class="product-form active">
        <h3>Agregar Nuevo Producto al Inventario</h3>
        
        <div class="form-group">
            <label for="newName">Nombre del Producto:</label>
            <input type="text" id="newName" placeholder="Ej: Procesador Intel Core i7">
        </div>
        
        <div class="form-group">
            <label for="newPrice">Precio ($):</label>
            <input type="number" id="newPrice" step="0.01" placeholder="Ej: 15.50">
        </div>
        
        <button onclick="crearProductoHandler()">➕ Crear Producto</button>
        
        <div id="prodMsg" class="product-msg" style="margin-top: 10px;"></div>
    </div>

    <!-- TODO: Agregar listado de productos -->
    <div style="margin-top: 30px; padding: 15px; background-color: #fafafa; border-radius: 4px; border: 1px solid #bdc3c7;">
        <h3>📊 Catálogo Actual</h3>
        <div id="menuList" style="margin-top: 15px;">
            <p style="color: #7f8c8d;">Cargando menú...</p>
        </div>
    </div>
</div>

<script type="module">
    import { AuthModule } from '../js/auth.js';
    import { PedidosModule } from '../js/pedidos.js';
    import { MenuModule } from '../js/menu.js';
    import { Utils } from '../js/utils.js';

    // Verificar autenticación (en real world, usar session/JWT)
    // TODO: Implementar verificación real de sesión
    const usuarios = sessionStorage.getItem('usuario_actual');
    if (!usuarios) {
        // Opcional: redirigir a login
        console.warn('No hay sesión activa - considera implementar login');
    }

    // Cargar y mostrar catálogo actual
    async function cargarMenuActual() {
        try {
            const menu = await MenuModule.cargarMenu();
            const menuList = document.getElementById('menuList');
            
            if (Object.keys(menu).length === 0) {
                menuList.innerHTML = '<p style="color: #7f8c8d;">No hay productos</p>';
                return;
            }

            let html = '<table><thead><tr><th>ID</th><th>Nombre</th><th>Precio</th></tr></thead><tbody>';
            Object.entries(menu).forEach(([id, item]) => {
                html += `<tr><td>${id}</td><td>${item.name}</td><td>${Utils.formatoMoneda(item.price)}</td></tr>`;
            });
            html += '</tbody></table>';
            
            menuList.innerHTML = html;
        } catch (error) {
            console.error('Error cargando menú:', error);
            document.getElementById('menuList').innerHTML = '<p style="color: #c0392b;">Error cargando menú</p>';
        }
    }

    // Crear producto
    window.crearProductoHandler = async function() {
        const nombre = document.getElementById('newName').value;
        const precio = document.getElementById('newPrice').value;
        const msgDiv = document.getElementById('prodMsg');

        try {
            await PedidosModule.crearProducto(nombre, precio);
            msgDiv.textContent = '✅ Producto creado exitosamente';
            msgDiv.classList.remove('error');
            msgDiv.classList.add('success');
            
            // Limpiar formulario
            Utils.limpiarFormulario(['newName', 'newPrice']);
            
            // Recargar menú
            await Utils.esperar(1000);
            await cargarMenuActual();
        } catch (error) {
            msgDiv.textContent = '❌ Error: ' + error.message;
            msgDiv.classList.remove('success');
            msgDiv.classList.add('error');
        }
    };

    // Cerrar sesión
    window.cerrarSesion = function() {
        sessionStorage.removeItem('usuario_actual');
        window.location.href = './login.html';
    };

    // Inicializar
    cargarMenuActual();
</script>

</body>
</html>
