<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fēngli 丰利酒楼 — Acceso</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

<div class="contenedor-principal">
    <a href="../index.html" class="logo-marca">
        <img src="../img/logo.png" alt="Fēngli Restaurante Chino 丰利酒楼">
    </a>

    <span class="eyebrow">丰利酒楼</span>
    <h2>🔐 Acceso al Sistema</h2>

    <div class="auth-section">
        <div class="form-group">
            <label for="user">Usuario:</label>
            <input type="text" id="user" placeholder="Ingrese usuario" autocomplete="username">
        </div>
        
        <div class="form-group">
            <label for="pass">Contraseña:</label>
            <input type="password" id="pass" placeholder="Ingrese contraseña" autocomplete="current-password">
        </div>
        
        <button id="loginBtn" onclick="manejarLogin()">Ingresar</button>
        
        <div id="authMsg" class="auth-msg"></div>
    </div>

    <div class="credenciales-demo">
        <p><strong>Demo credentials:</strong></p>
        <p>Usuario: <code>admin</code></p>
        <p>Contraseña: <code>admin</code></p>
        <p class="aviso">
            ⚠️ <strong>TODO:</strong> Estas credenciales NO deben estar en cliente en producción.
        </p>
    </div>

    <div class="volver">
        <a href="../index.html">← Volver al inicio</a>
    </div>
</div>

<script type="module">
    import { AuthModule } from '../js/auth.js';

    window.manejarLogin = function() {
        const usuario = document.getElementById('user').value;
        const password = document.getElementById('pass').value;

        const elementos = {
            authMsg: document.getElementById('authMsg'),
            loginBtn: document.getElementById('loginBtn'),
            logoutBtn: null,
            productForm: null
        };

        if (AuthModule.login(usuario, password, elementos)) {
            // Persistir sesión y redirigir al panel de administración
            sessionStorage.setItem('usuario_actual', usuario);
            setTimeout(() => {
                window.location.href = './admin.html';
            }, 800);
        }
    };

    // Permitir login con Enter
    document.getElementById('pass').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            window.manejarLogin();
        }
    });
</script>

</body>
</html>
